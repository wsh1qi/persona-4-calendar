<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P4 Schedule System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --p4-yellow: #ffe100;
            --p4-black: #080808;
            --p4-ink: #151515;
            --p4-white: #f5f4ef;
            --p4-purple: #6c44d6;
            --p4-violet: #31206f;
            --p4-red: #d83b2d;
            --p4-blue: #1c2363;
            --p4-gray: #5a5a5a;
            --p4-shadow: rgba(0, 0, 0, 0.82);
            --panel-yellow: rgba(255, 225, 0, 0.9);
            --panel-white: rgba(245, 244, 239, 0.92);
            --panel-black: rgba(12, 12, 12, 0.9);
            --mobile-stage-scale: 1;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            color: var(--p4-white);
            background:
                radial-gradient(circle at 15% 20%, rgba(108, 68, 214, 0.22), transparent 24%),
                radial-gradient(circle at 80% 15%, rgba(255, 225, 0, 0.12), transparent 20%),
                radial-gradient(circle at 50% 80%, rgba(108, 68, 214, 0.14), transparent 34%),
                linear-gradient(135deg, #020202 0%, #16103f 44%, #090909 100%);
            font-family: "Arial Black", Impact, "Franklin Gothic Heavy", sans-serif;
            letter-spacing: 0.04em;
        }

        ::selection {
            background: var(--p4-red);
            color: var(--p4-white);
        }

        ::-webkit-scrollbar {
            width: 14px;
        }

        ::-webkit-scrollbar-track {
            background:
                linear-gradient(180deg, var(--p4-black), #10174a);
            border-left: 3px solid var(--p4-yellow);
        }

        ::-webkit-scrollbar-thumb {
            background:
                repeating-linear-gradient(
                    -45deg,
                    var(--p4-yellow) 0 10px,
                    var(--p4-black) 10px 14px
                );
            border: 2px solid var(--p4-white);
        }

        ::-webkit-scrollbar-thumb:hover {
            background:
                repeating-linear-gradient(
                    -45deg,
                    var(--p4-purple) 0 10px,
                    var(--p4-black) 10px 14px
                );
        }

        #webgl-container,
        #audio-visualizer,
        .background-stack,
        .vignette-overlay,
        .tv-static,
        .midnight-channel {
            position: absolute;
            inset: 0;
        }

        #webgl-container {
            z-index: -7;
            opacity: 0.97;
        }

        #audio-visualizer {
            top: auto;
            height: 180px;
            z-index: -3;
            opacity: 0.72;
            pointer-events: none;
        }

        .background-stack {
            z-index: -5;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-gradient {
            position: absolute;
            inset: -10%;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 225, 0, 0.18), transparent 18%),
                radial-gradient(circle at 82% 24%, rgba(108, 68, 214, 0.22), transparent 22%),
                radial-gradient(circle at 45% 85%, rgba(255, 225, 0, 0.1), transparent 22%),
                conic-gradient(from 150deg at 50% 50%, rgba(255, 225, 0, 0.18), rgba(8, 8, 8, 0) 18%, rgba(108, 68, 214, 0.2) 30%, rgba(8, 8, 8, 0) 44%, rgba(49, 32, 111, 0.18) 60%, rgba(8, 8, 8, 0) 77%, rgba(255, 225, 0, 0.18));
            filter: saturate(120%);
            animation: slowDrift 28s ease-in-out infinite alternate;
        }

        .bg-halftone {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(255, 225, 0, 0.18) 1px, transparent 1px);
            background-size: 13px 13px;
            opacity: 0.1;
            mix-blend-mode: screen;
            transform: rotate(-8deg) scale(1.25);
        }

        .bg-diagonals {
            position: absolute;
            inset: -15%;
            background:
                repeating-linear-gradient(
                    -63deg,
                    transparent 0 42px,
                    rgba(255, 225, 0, 0.12) 42px 58px,
                    rgba(108, 68, 214, 0.2) 58px 74px,
                    rgba(0, 0, 0, 0.55) 74px 92px,
                    transparent 92px 124px
                );
            opacity: 0.72;
            animation: slideBands 36s linear infinite;
        }

        .bg-diagonals::before,
        .bg-diagonals::after {
            content: "";
            position: absolute;
            left: -12%;
            right: -12%;
            height: 84px;
            border-top: 4px solid var(--p4-black);
            border-bottom: 4px solid var(--p4-black);
            background:
                repeating-linear-gradient(
                    -45deg,
                    var(--p4-yellow) 0 24px,
                    var(--p4-black) 24px 40px,
                    var(--p4-purple) 40px 56px,
                    var(--p4-black) 56px 72px
                );
            box-shadow: 0 8px 0 rgba(255, 225, 0, 0.2);
            opacity: 0.72;
        }

        .bg-diagonals::before {
            top: 18%;
            transform: rotate(-10deg) translateX(-2%);
        }

        .bg-diagonals::after {
            bottom: 14%;
            transform: rotate(-7deg) translateX(4%);
            animation: ribbonFloat 26s linear infinite reverse;
        }

        .bg-kaleido-ring {
            position: absolute;
            inset: 8% 12% 12% 12%;
            border-radius: 50%;
            background:
                conic-gradient(from 45deg, rgba(255, 225, 0, 0.26), rgba(8, 8, 8, 0) 10%, rgba(108, 68, 214, 0.22) 20%, rgba(8, 8, 8, 0) 30%, rgba(255, 225, 0, 0.18) 40%, rgba(8, 8, 8, 0) 52%, rgba(49, 32, 111, 0.24) 66%, rgba(8, 8, 8, 0) 80%, rgba(255, 225, 0, 0.24));
            mix-blend-mode: screen;
            filter: blur(6px);
            opacity: 0.72;
            animation: kaleidoSpin 56s linear infinite;
        }

        .bg-kaleido-core {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(70vw, 760px);
            height: min(70vw, 760px);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background:
                radial-gradient(circle at center, rgba(255, 225, 0, 0.34) 0 10%, rgba(255, 225, 0, 0.14) 10% 12%, rgba(49, 32, 111, 0.86) 12% 24%, rgba(8, 8, 8, 0.22) 24% 26%, transparent 26% 100%);
            box-shadow:
                0 0 0 26px rgba(8, 8, 8, 0.18),
                0 0 0 56px rgba(108, 68, 214, 0.12),
                0 0 0 96px rgba(8, 8, 8, 0.1);
            opacity: 0.9;
            animation: kaleidoBreath 14s ease-in-out infinite alternate;
        }

        .bg-cutout {
            position: absolute;
            background: var(--p4-yellow);
            border: 5px solid var(--p4-black);
            box-shadow: 12px 12px 0 var(--p4-shadow);
            transform-origin: center;
        }

        .bg-cutout.one {
            width: 24vw;
            height: 16vw;
            min-width: 260px;
            min-height: 180px;
            right: -5vw;
            top: 6vh;
            transform: rotate(12deg) skew(-14deg);
            clip-path: polygon(0 14%, 76% 0, 100% 28%, 90% 100%, 8% 90%);
            background:
                linear-gradient(135deg, rgba(255, 225, 0, 0.28), transparent 36%),
                repeating-linear-gradient(-45deg, transparent 0 14px, rgba(0, 0, 0, 0.16) 14px 22px),
                var(--p4-yellow);
        }

        .bg-cutout.two {
            width: 22vw;
            height: 22vw;
            min-width: 220px;
            min-height: 220px;
            left: -7vw;
            bottom: 10vh;
            border-radius: 50%;
            transform: rotate(-11deg);
            background:
                radial-gradient(circle at 35% 30%, rgba(255, 225, 0, 0.3), transparent 26%),
                repeating-linear-gradient(35deg, rgba(0, 0, 0, 0.08) 0 12px, transparent 12px 26px),
                var(--p4-purple);
        }

        .bg-cutout.three {
            width: 34vw;
            height: 12vw;
            min-width: 320px;
            min-height: 120px;
            left: 8vw;
            top: -4vh;
            transform: rotate(-8deg) skew(-26deg);
            clip-path: polygon(5% 0, 100% 0, 91% 100%, 0 100%);
            background:
                linear-gradient(90deg, rgba(8, 8, 8, 0.88) 0 18%, transparent 18% 22%, rgba(8, 8, 8, 0.88) 22% 40%, transparent 40% 44%, rgba(8, 8, 8, 0.88) 44% 58%, transparent 58% 62%, rgba(8, 8, 8, 0.88) 62% 76%, transparent 76% 80%, rgba(8, 8, 8, 0.88) 80% 100%),
                var(--p4-yellow);
            opacity: 0.94;
        }

        .bg-alert {
            position: absolute;
            left: -8vw;
            right: -8vw;
            bottom: 20vh;
            height: 68px;
            border-top: 5px solid var(--p4-black);
            border-bottom: 5px solid var(--p4-black);
            background:
                repeating-linear-gradient(
                    -45deg,
                    var(--p4-yellow) 0 28px,
                    var(--p4-black) 28px 48px
                );
            box-shadow: 0 8px 0 rgba(255, 225, 0, 0.24);
            opacity: 0.65;
            transform: rotate(-6deg);
        }

        .scene-tags {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -2;
        }

        .corner-image {
            position: absolute;
            display: block;
            object-fit: cover;
            pointer-events: none;
            filter: drop-shadow(12px 12px 0 rgba(0, 0, 0, 0.78));
        }

        .corner-image.tv {
            top: 32px;
            right: 38px;
            width: 168px;
            height: 150px;
            transform: rotate(8deg);
        }

        .corner-image.kuma {
            left: 30px;
            bottom: 26px;
            width: 178px;
            height: 178px;
            transform: rotate(-9deg);
        }

        .screen-frame {
            position: absolute;
            inset: 18px;
            border: 5px solid rgba(255, 225, 0, 0.18);
            box-shadow:
                inset 0 0 0 2px rgba(108, 68, 214, 0.24),
                inset 0 0 0 12px rgba(0, 0, 0, 0.16);
            pointer-events: none;
            z-index: 98;
        }

        .scanline-overlay {
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 225, 0, 0.07) 0 1px,
                    rgba(0, 0, 0, 0) 1px 4px
                );
            opacity: 0.16;
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 97;
        }

        .vignette-overlay {
            pointer-events: none;
            z-index: 999;
            background:
                radial-gradient(circle at center, transparent 45%, rgba(0, 0, 0, 0.2) 70%, rgba(0, 0, 0, 0.88) 100%);
            box-shadow:
                inset 0 0 180px rgba(0, 0, 0, 0.9),
                inset 0 0 30px rgba(255, 225, 0, 0.4);
        }

        .tv-static {
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.06s;
            mix-blend-mode: screen;
            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .tv-static.active {
            opacity: 0.92;
            pointer-events: all;
        }

        .midnight-channel {
            z-index: 1001;
            opacity: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at center, rgba(108, 68, 214, 0.12), rgba(108, 68, 214, 0.45), rgba(0, 0, 0, 0.95));
            mix-blend-mode: color-burn;
            transition: opacity 0.08s;
        }

        .app-window {
            position: relative;
            z-index: 12;
            width: min(1180px, 94vw);
            min-height: min(88vh, 940px);
            max-height: 90vh;
            padding: 34px 36px 54px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 25%),
                linear-gradient(180deg, rgba(255, 225, 0, 0.95) 0%, rgba(255, 225, 0, 0.85) 56%, rgba(244, 214, 0, 0.92) 100%);
            border: 7px solid var(--p4-black);
            box-shadow:
                22px 24px 0 rgba(0, 0, 0, 0.85),
                0 0 0 5px rgba(255, 255, 255, 0.16);
            clip-path: polygon(0 3%, 4% 0, 100% 0, 100% 97%, 96% 100%, 0 100%);
            isolation: isolate;
            -webkit-overflow-scrolling: touch;
        }

        .ui-stage {
            position: relative;
            z-index: 12;
            width: 100%;
            display: contents;
        }

        .app-window::before {
            content: "";
            position: absolute;
            inset: 14px;
            border: 3px solid rgba(0, 0, 0, 0.9);
            clip-path: polygon(0 4%, 4% 0, 100% 0, 100% 96%, 96% 100%, 0 100%);
            pointer-events: none;
            opacity: 0.5;
        }

        .app-window::after {
            content: "";
            position: absolute;
            right: 18px;
            top: 18px;
            width: 180px;
            height: 18px;
            background:
                linear-gradient(90deg, var(--p4-black) 0 28%, transparent 28% 34%, var(--p4-black) 34% 56%, transparent 56% 62%, var(--p4-black) 62% 100%);
            transform: skew(-30deg);
            opacity: 0.9;
            pointer-events: none;
        }

        .chrome-ribbon {
            position: absolute;
            top: -18px;
            left: 26px;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            border: 4px solid var(--p4-black);
            background: var(--p4-white);
            color: var(--p4-black);
            transform: rotate(-3deg) skew(-16deg);
            box-shadow: 10px 10px 0 var(--p4-shadow);
            text-transform: uppercase;
            font-size: 0.9rem;
            z-index: 3;
        }

        .user-bar {
            position: absolute;
            top: 18px;
            left: 220px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            z-index: 3;
        }

        .user-chip,
        .logout-btn {
            border: 4px solid var(--p4-black);
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.7);
            font: inherit;
            text-transform: uppercase;
        }

        .user-chip {
            padding: 9px 14px;
            background: var(--p4-white);
            color: var(--p4-black);
            transform: skew(-12deg);
        }

        .user-chip span,
        .logout-btn span {
            display: inline-block;
            transform: skew(12deg);
        }

        .logout-btn {
            padding: 9px 14px;
            background: var(--p4-purple);
            color: var(--p4-white);
            cursor: pointer;
            transform: skew(-12deg);
        }

        .chrome-ribbon span {
            transform: skew(16deg);
        }

        .chrome-ribbon .pulse {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--p4-purple);
            box-shadow: 0 0 0 3px var(--p4-black);
            animation: blink 1.4s infinite;
        }

        .content-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 0;
            flex: 1;
        }

        .hud-wrapper {
            position: relative;
            align-self: flex-start;
            margin-top: 16px;
            margin-bottom: 6px;
            padding-top: 16px;
        }

        .hud-live {
            position: absolute;
            top: 0;
            left: 6px;
            z-index: 2;
            padding: 3px 10px;
            border: 3px solid var(--p4-black);
            background: var(--p4-purple);
            color: var(--p4-white);
            font-size: 0.92rem;
            box-shadow: 4px 4px 0 var(--p4-shadow);
            transform: rotate(-4deg) skew(-10deg);
            animation: blink 1.6s infinite;
        }

        .hud-container {
            display: flex;
            align-items: stretch;
            cursor: pointer;
            transform: skew(-14deg);
            transition: transform 0.2s ease, filter 0.2s ease;
            filter: drop-shadow(10px 10px 0 rgba(0, 0, 0, 0.76));
        }

        .hud-container:hover {
            transform: skew(-14deg) translateY(-4px);
        }

        .hud-month,
        .hud-day,
        .hud-weekday {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--p4-black);
            text-transform: uppercase;
        }

        .hud-month {
            min-width: 110px;
            padding: 0 18px;
            background:
                repeating-linear-gradient(-45deg, var(--p4-black) 0 11px, #2a215c 11px 18px);
            color: var(--p4-yellow);
            font-size: clamp(2.2rem, 5vw, 3.2rem);
        }

        .hud-day {
            margin-left: -8px;
            padding: 0 26px;
            background: var(--p4-white);
            color: var(--p4-black);
            font-size: clamp(3.6rem, 8vw, 5.4rem);
            line-height: 1;
            min-height: 106px;
            position: relative;
        }

        .hud-day::after {
            content: "";
            position: absolute;
            right: -14px;
            bottom: -14px;
            width: 38px;
            height: 38px;
            background: var(--p4-purple);
            border: 4px solid var(--p4-black);
            transform: rotate(12deg);
        }

        .hud-weekday {
            min-width: 124px;
            margin-left: -6px;
            padding: 0 16px;
            background: var(--p4-black);
            color: var(--p4-yellow);
            font-size: clamp(1.05rem, 2vw, 1.5rem);
        }

        .calendar-view,
        .schedule-view {
            flex-grow: 1;
        }

        .calendar-view {
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 18px;
            min-height: 0;
        }

        .calendar-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 18px;
            margin-top: 8px;
        }

        .current-month-year-wrap {
            position: relative;
            min-width: 0;
        }

        .current-month-year-wrap::before {
            content: "INVESTIGATION CALENDAR";
            position: absolute;
            top: -18px;
            left: 16px;
            padding: 3px 9px;
            background: var(--p4-black);
            color: var(--p4-purple);
            border: 3px solid var(--p4-white);
            transform: skew(-14deg);
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            white-space: nowrap;
        }

        .nav-btn,
        .back-btn,
        .add-btn,
        .bgm-btn {
            border: 4px solid var(--p4-black);
            cursor: pointer;
            font-family: inherit;
            font-weight: 900;
            text-transform: uppercase;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .nav-btn {
            min-width: 150px;
            padding: 14px 22px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent 35%),
                var(--p4-black);
            color: var(--p4-yellow);
            box-shadow: 7px 7px 0 rgba(255, 255, 255, 0.28);
            transform: skew(-12deg);
            font-size: 1.05rem;
        }

        .nav-btn span {
            display: inline-block;
            transform: skew(12deg);
        }

        .nav-btn:hover,
        .back-btn:hover,
        .add-btn:hover,
        .bgm-btn:hover {
            transform: translate(-2px, -3px) skew(-12deg);
        }

        .current-month-year {
            display: block;
            width: 100%;
            padding: 18px 22px 16px;
            border: 5px solid var(--p4-black);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.32), transparent 34%),
                var(--p4-white);
            color: var(--p4-black);
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.76);
            transform: skew(-10deg);
            font-size: clamp(1.45rem, 3vw, 2.2rem);
            letter-spacing: 0.14em;
            text-align: center;
        }

        .current-month-year strong {
            display: inline-block;
            transform: skew(10deg);
        }

        .grid-header {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 14px;
        }

        .grid-header div {
            padding: 10px 8px;
            border: 4px solid var(--p4-black);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent 35%),
                var(--p4-black);
            color: var(--p4-yellow);
            box-shadow: 6px 6px 0 rgba(255, 255, 255, 0.25);
            transform: skew(-10deg);
            text-align: center;
            font-size: clamp(0.8rem, 1.6vw, 1.05rem);
        }

        .grid-header span {
            display: inline-block;
            transform: skew(10deg);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 14px;
            flex-grow: 1;
            align-content: start;
        }

        .day-cell {
            position: relative;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 10px 12px;
            border: 5px solid var(--p4-black);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 28%),
                repeating-linear-gradient(-45deg, transparent 0 8px, rgba(0, 0, 0, 0.12) 8px 16px),
                var(--p4-yellow);
            color: var(--p4-black);
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.82);
            cursor: pointer;
            transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease, color 0.14s ease;
            overflow: hidden;
        }

        .day-cell::before {
            content: "";
            position: absolute;
            inset: auto -18px -18px auto;
            width: 56px;
            height: 56px;
            background: rgba(0, 0, 0, 0.08);
            transform: rotate(22deg);
        }

        .day-cell:hover {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.14), transparent 24%),
                repeating-linear-gradient(-45deg, transparent 0 8px, rgba(255, 255, 255, 0.09) 8px 16px),
                var(--p4-black);
            color: var(--p4-yellow);
            box-shadow: 12px 12px 0 rgba(255, 255, 255, 0.28);
            transform: translate(-2px, -4px) rotate(-1.2deg);
            z-index: 2;
        }

        .day-cell.is-empty {
            visibility: hidden;
            pointer-events: none;
            box-shadow: none;
        }

        .day-num {
            position: relative;
            z-index: 1;
            font-size: clamp(1.65rem, 2.6vw, 2.1rem);
            line-height: 1;
        }

        .day-marker {
            align-self: flex-end;
            display: inline-flex;
            align-items: center;

    <script>
        function createStripePattern(ctx, bg, fg, size, thickness, angle) {
            const patternCanvas = document.createElement("canvas");
            patternCanvas.width = size;
            patternCanvas.height = size;
            const pctx = patternCanvas.getContext("2d");

            pctx.fillStyle = bg;
            pctx.fillRect(0, 0, size, size);
            pctx.translate(size / 2, size / 2);
            pctx.rotate(angle);
            pctx.translate(-size / 2, -size / 2);
            pctx.fillStyle = fg;

            for (let i = -size; i < size * 2; i += thickness * 2) {
                pctx.fillRect(i, -size, thickness, size * 3);
            }

            return ctx.createPattern(patternCanvas, "repeat");
        }

        function createDotPattern(ctx, bg, fg, size, dotSize) {
            const patternCanvas = document.createElement("canvas");
            patternCanvas.width = size;
            patternCanvas.height = size;
            const pctx = patternCanvas.getContext("2d");

            pctx.fillStyle = bg;
            pctx.fillRect(0, 0, size, size);
            pctx.fillStyle = fg;
            pctx.beginPath();
            pctx.arc(size / 2, size / 2, dotSize, 0, Math.PI * 2);
            pctx.fill();

            return ctx.createPattern(patternCanvas, "repeat");
        }

        function createP4TunnelTexture() {
            const size = 2048;
            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            const cx = size / 2;
            const cy = size / 2;

            function starPath(outerRadius, innerRadius, spikes, rotation) {
                ctx.beginPath();
                for (let i = 0; i < spikes * 2; i++) {
                    const angle = (Math.PI / spikes) * i + rotation;
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const x = cx + Math.cos(angle) * radius;
                    const y = cy + Math.sin(angle) * radius;
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
            }

            function diamondPath(radius, rotation) {
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = Math.PI / 2 * i + rotation;
                    const x = cx + Math.cos(angle) * radius;
                    const y = cy + Math.sin(angle) * radius;
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
            }

            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, size, size);

            const stripePattern = createStripePattern(ctx, "#ffe100", "#080808", 112, 16, -Math.PI / 4);
            const purplePattern = createStripePattern(ctx, "#31206f", "#080808", 96, 14, Math.PI / 4);
            const dotPattern = createDotPattern(ctx, "#ffe100", "rgba(0,0,0,0.5)", 30, 2.0);

            ctx.fillStyle = "#080808";
            ctx.beginPath();
            ctx.arc(cx, cy, 1040, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(Math.PI / 9);
            ctx.translate(-cx, -cy);
            ctx.fillStyle = stripePattern;
            starPath(980, 540, 4, 0);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = "#080808";
            starPath(860, 420, 4, Math.PI / 4);
            ctx.fill();

            ctx.fillStyle = purplePattern;
            starPath(700, 340, 4, 0);
            ctx.fill();

            ctx.fillStyle = "#ffe100";
            diamondPath(470, Math.PI / 4);
            ctx.fill();

            ctx.fillStyle = "#120c66";
            starPath(430, 170, 4, 0);
            ctx.fill();

            ctx.fillStyle = "#080808";
            diamondPath(310, 0);
            ctx.fill();

            ctx.fillStyle = "#ffe100";
            starPath(250, 120, 4, Math.PI / 4);
            ctx.fill();

            ctx.fillStyle = dotPattern;
            ctx.beginPath();
            ctx.arc(cx, cy, 140, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#080808";
            ctx.lineWidth = 26;
            ctx.beginPath();
            ctx.arc(cx, cy, 112, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = "#ffe100";
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.arc(cx, cy, 138, 0, Math.PI * 2);
            ctx.stroke();

            for (let i = 0; i < 24; i++) {
                const angle = (Math.PI * 2 * i) / 24;
                const inner = 168;
                const outer = 320 + (i % 2) * 38;
                ctx.strokeStyle = i % 4 === 0 ? "#ffe100" : i % 4 === 1 ? "#080808" : i % 4 === 2 ? "#31206f" : "#ffe100";
                ctx.lineWidth = i % 2 === 0 ? 14 : 8;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
                ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
                ctx.stroke();
            }

            ctx.globalCompositeOperation = "destination-out";
            starPath(96, 48, 8, 0);
            ctx.fill();
            ctx.globalCompositeOperation = "source-over";

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 16;
            return texture;
        }

        let scene;
        let camera;
        let renderer;
        let tunnelGroup;
        let particles;
        const planes = [];

        const SPACING = 240;
        const NUM_PLANES = 60;
        const DEPTH = SPACING * NUM_PLANES;
        const SPEED = 1.25;
        let globalZ = 0;

        function initThreeJS() {
            const container = document.getElementById("webgl-container");

            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x040404, 1200, DEPTH - 1800);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, DEPTH);
            camera.position.set(0, 0, 120);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            tunnelGroup = new THREE.Group();
            scene.add(tunnelGroup);

            const texture = createP4TunnelTexture();
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide,
                opacity: 0.72
            });
            const geometry = new THREE.PlaneGeometry(1500, 1500);

            for (let i = 0; i < NUM_PLANES; i++) {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.rotation.z = i % 2 === 0 ? 0 : Math.PI / 4;
                mesh.userData.spin = i % 3 === 0 ? 0.0005 : -0.00035;
                planes.push(mesh);
                tunnelGroup.add(mesh);
            }

            const particleGeometry = new THREE.BufferGeometry();
            const particleCount = 1200;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const palette = [
                new THREE.Color(0xffe100),
                new THREE.Color(0x31206f),
                new THREE.Color(0xf5f4ef),
                new THREE.Color(0x080808)
            ];

            for (let i = 0; i < particleCount; i++) {
                const offset = i * 3;
                positions[offset] = (Math.random() - 0.5) * 1800;
                positions[offset + 1] = (Math.random() - 0.5) * 1800;
                positions[offset + 2] = -Math.random() * DEPTH;

                const color = palette[i % palette.length];
                colors[offset] = color.r;
                colors[offset + 1] = color.g;
                colors[offset + 2] = color.b;
            }

            particleGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: 3,
                transparent: true,
                opacity: 0.42,
                vertexColors: true
            });

            particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);

            window.addEventListener("resize", onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeVisualizer();
            updateMobileStageScale();
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.00024;
            camera.position.x = Math.sin(time * 0.8) * 16;
            camera.position.y = Math.cos(time * 0.7) * 12;
            camera.position.z = 120;
            camera.lookAt(0, 0, -DEPTH);

            globalZ += SPEED * 0.95;

            for (let i = 0; i < NUM_PLANES; i++) {
                let newZ = -i * SPACING + globalZ;
                while (newZ > 200) {
                    newZ -= DEPTH;
                }

                const mesh = planes[i];
                mesh.position.z = newZ;
                mesh.rotation.z += mesh.userData.spin;
                const depthFactor = 1 - Math.abs(newZ) / DEPTH;
                mesh.scale.setScalar(1 + depthFactor * 0.08);
            }

            tunnelGroup.rotation.z += 0.0011;

            const positions = particles.geometry.attributes.position.array;
            for (let i = 2; i < positions.length; i += 3) {
                positions[i] += SPEED * 2.2;
                if (positions[i] > 200) {
                    positions[i] -= DEPTH;
                }
            }
            particles.rotation.z -= 0.00055;
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        window.onload = async function() {
            initThreeJS();
            initVisualizer();
            updateMobileStageScale();
            await initSchedule();
        };

        let scheduleData = {};
        let todayDate;
        let displayYear;
        let displayMonth;
        let selectedDateStr;
        let currentUser = null;
        const mobileStageDesignWidth = 1240;
        const mobileStageDesignHeight = 1040;

        const hudMonth = document.getElementById("hudMonth");
        const hudDay = document.getElementById("hudDay");
        const hudWeekday = document.getElementById("hudWeekday");
        const navMonthYear = document.getElementById("currentMonthYear");
        const scheduleTitle = document.getElementById("scheduleTitle");
        const userLabel = document.getElementById("userLabel");
        const logoutBtn = document.getElementById("logoutBtn");
        const weekdays = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

        function updateMobileStageScale() {
            if (window.innerWidth > 640) {
                document.documentElement.style.setProperty("--mobile-stage-scale", "1");
                return;
            }

            const widthScale = window.innerWidth / mobileStageDesignWidth;
            const heightScale = window.innerHeight / mobileStageDesignHeight;
            const scale = Math.min(widthScale, heightScale);
            document.documentElement.style.setProperty("--mobile-stage-scale", String(Math.max(scale, 0.34)));
        }

        async function apiFetch(url, options = {}) {
            const response = await fetch(url, {
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                },
                ...options
            });
            const data = await response.json().catch(() => ({}));
            if (response.status === 401) {
                window.location.href = "/";
                throw new Error("Unauthorized");
            }
            if (!response.ok) {
                throw new Error(data.error || "Request failed");
            }
            return data;
        }

        async function loadScheduleData() {
            const data = await apiFetch("/api/schedule");
            scheduleData = data.schedule || {};
        }

        async function initSchedule() {
            const me = await apiFetch("/api/me");
            if (!me.authenticated) {
                window.location.href = "/";
                return;
            }

            currentUser = me.user;
            userLabel.textContent = currentUser.username;
            todayDate = new Date();
            displayYear = todayDate.getFullYear();
            displayMonth = todayDate.getMonth();

            await loadScheduleData();
            updateHUD(todayDate);
            renderCalendar(displayYear, displayMonth);

            document.getElementById("hudClick").addEventListener("click", () => {
                displayYear = todayDate.getFullYear();
                displayMonth = todayDate.getMonth();
                updateHUD(todayDate);
                playTVStatic(() => {
                    renderCalendar(displayYear, displayMonth);
                    switchView("calendar");
                });
            });

            logoutBtn.addEventListener("click", async () => {
                await apiFetch("/api/logout", { method: "POST", body: JSON.stringify({}) });
                window.location.href = "/";
            });
        }

        function updateHUD(date) {
            hudMonth.innerText = date.getMonth() + 1;
            hudDay.innerText = date.getDate();
            hudWeekday.innerText = weekdays[date.getDay()];
        }

        function formatSelectedDate(year, month, day) {
            return `${year}.${String(month + 1).padStart(2, "0")}.${String(day).padStart(2, "0")}`;
        }

        function changeMonth(offset) {
            playTVStatic(() => {
                displayMonth += offset;
                if (displayMonth < 0) {
                    displayMonth = 11;
                    displayYear--;
                } else if (displayMonth > 11) {
                    displayMonth = 0;
                    displayYear++;
                }
                renderCalendar(displayYear, displayMonth);
            });
        }
        window.changeMonth = changeMonth;

        function renderCalendar(year, month) {
            const grid = document.getElementById("calendarGrid");
            grid.innerHTML = "";
            const displayMonthStr = String(month + 1).padStart(2, "0");
            navMonthYear.innerHTML = `<strong>${year} / ${displayMonthStr}</strong>`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const totalCells = 42;

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.className = "day-cell is-empty";
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${month + 1}-${day}`;
                const tasks = scheduleData[dateStr] || [];
                const hasTask = tasks.length > 0;

                const cell = document.createElement("div");
                cell.className = `day-cell ${hasTask ? "has-task" : ""}`;

                if (year === todayDate.getFullYear() && month === todayDate.getMonth() && day === todayDate.getDate()) {
                    cell.classList.add("today");
                }

                cell.innerHTML = `
                    <span class="day-num">${day}</span>
                    <span class="day-marker"><span>${hasTask ? `${tasks.length} Task${tasks.length > 1 ? "s" : ""}` : "Free"}</span></span>
                `;
                cell.onclick = () => openDaySchedule(year, month, day);
                grid.appendChild(cell);
            }

            const trailingCells = totalCells - firstDay - daysInMonth;
            for (let i = 0; i < trailingCells; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.className = "day-cell is-empty";
                grid.appendChild(emptyCell);
            }
        }

        function playTVStatic(callback) {
            const staticScreen = document.getElementById("tvStatic");
            const midnight = document.getElementById("midnightChannel");
            const isEasterEgg = Math.random() < 0.05;

            staticScreen.classList.add("active");
            if (isEasterEgg) {
                midnight.style.opacity = "1";
            }

            setTimeout(() => {
                callback();
                setTimeout(() => {
                    staticScreen.classList.remove("active");
                    if (isEasterEgg) {
                        midnight.style.opacity = "0";
                    }
                }, 60);
            }, 90);
        }

        function switchView(view) {
            if (view === "calendar") {
                document.getElementById("calendarView").style.display = "grid";
                document.getElementById("scheduleView").style.display = "none";
                updateHUD(todayDate);
                renderCalendar(displayYear, displayMonth);
            } else {
                document.getElementById("calendarView").style.display = "none";
                document.getElementById("scheduleView").style.display = "flex";
            }
        }
        window.switchView = switchView;

        function openDaySchedule(year, month, day) {
            playTVStatic(() => {
                selectedDateStr = `${year}-${month + 1}-${day}`;
                const clickDate = new Date(year, month, day);
                updateHUD(clickDate);
                scheduleTitle.innerHTML = `<span>${formatSelectedDate(year, month, day)}</span>`;
                renderTaskList();
                switchView("schedule");
            });
        }

        function renderTaskList() {
            const list = document.getElementById("taskList");
            list.innerHTML = "";
            const tasks = [...(scheduleData[selectedDateStr] || [])];

            if (tasks.length === 0) {
                list.innerHTML = `<div class="no-data">NO DATA</div>`;
                return;
            }

            tasks.sort((a, b) => a.time.localeCompare(b.time));

            tasks.forEach(task => {
                const li = document.createElement("li");
                li.className = `task-item ${task.completed ? "completed" : ""}`;
                li.innerHTML = `
                    <span class="task-time">${task.time}</span>
                    <span class="task-text" onclick="toggleTask(${task.id})">${task.desc}</span>
                    <button class="del-btn" onclick="deleteTask(${task.id})">Delete</button>
                `;
                list.appendChild(li);
            });
        }

        async function addTask() {
            const timeVal = document.getElementById("taskTime").value;
            const descVal = document.getElementById("taskDesc").value.trim();
            if (!descVal) {
                alert("请输入任务内容。");
                return;
            }

            await apiFetch("/api/schedule", {
                method: "POST",
                body: JSON.stringify({
                    date_key: selectedDateStr,
                    time: timeVal,
                    desc: descVal,
                    completed: false
                })
            });

            await loadScheduleData();
            document.getElementById("taskDesc").value = "";
            renderTaskList();
            renderCalendar(displayYear, displayMonth);
        }
        window.addTask = addTask;

        async function toggleTask(taskId) {
            const task = (scheduleData[selectedDateStr] || []).find(item => item.id === taskId);
            if (!task) return;
            await apiFetch("/api/schedule/" + taskId, {
                method: "PATCH",
                body: JSON.stringify({ completed: !task.completed })
            });
            await loadScheduleData();
            renderTaskList();
            renderCalendar(displayYear, displayMonth);
        }
        window.toggleTask = toggleTask;

        async function deleteTask(taskId) {
            await apiFetch("/api/schedule/" + taskId, {
                method: "DELETE"
            });
            await loadScheduleData();
            renderTaskList();
            renderCalendar(displayYear, displayMonth);
        }
        window.deleteTask = deleteTask;

        const bgmBtn = document.getElementById("bgmBtn");
        const audioUpload = document.getElementById("audio-upload");
        const bgmPlayer = document.getElementById("bgmPlayer");
        const volumeSlider = document.getElementById("volumeSlider");

        let audioCtx;
        let analyser;
        let dataArray;
        let canvasCtx;
        let visCanvas;
        let isBgmLoaded = false;
        let isPlaying = false;
        let isAudioSetup = false;

        bgmPlayer.volume = volumeSlider.value;
        volumeSlider.addEventListener("input", event => {
            bgmPlayer.volume = event.target.value;
        });

        function setBgmButtonState(label, isActive) {
            bgmBtn.innerHTML = `<span>${label}</span>`;
            if (isActive) {
                bgmBtn.style.backgroundColor = "var(--p4-purple)";
                bgmBtn.style.color = "var(--p4-black)";
                bgmBtn.style.borderColor = "var(--p4-black)";
            } else {
                bgmBtn.style.backgroundColor = "var(--p4-black)";
                bgmBtn.style.color = "var(--p4-purple)";
                bgmBtn.style.borderColor = "var(--p4-purple)";
            }
        }

        function setupAudioAPI() {
            if (isAudioSetup) {
                return;
            }

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaElementSource(bgmPlayer);

            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            analyser.fftSize = 64;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isAudioSetup = true;
            drawVisualizer();
        }

        function initVisualizer() {
            visCanvas = document.getElementById("audio-visualizer");
            canvasCtx = visCanvas.getContext("2d");
            resizeVisualizer();
        }

        function resizeVisualizer() {
            if (!visCanvas) {
                return;
            }

            visCanvas.width = window.innerWidth;
            visCanvas.height = 180;
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            if (!isPlaying || !analyser) {
                canvasCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
                return;
            }

            analyser.getByteFrequencyData(dataArray);
            canvasCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);

            const barWidth = (visCanvas.width / dataArray.length) * 1.85;
            let x = 0;

            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = dataArray[i];
                const color = i % 4 === 0
                    ? "#ffe100"
                    : i % 4 === 1
                        ? "#6c44d6"
                        : i % 4 === 2
                            ? "#f5f4ef"
                            : "#31206f";

                canvasCtx.fillStyle = color;
                canvasCtx.save();
                canvasCtx.translate(x, visCanvas.height);
                canvasCtx.transform(1, 0, -0.28, 1, 0, 0);
                canvasCtx.fillRect(0, -barHeight / 1.35, Math.max(barWidth - 6, 4), barHeight / 1.35);
                canvasCtx.restore();
                x += barWidth;
            }
        }

        bgmBtn.addEventListener("click", () => {
            if (!isBgmLoaded) {
                audioUpload.click();
                return;
            }

            if (isPlaying) {
                bgmPlayer.pause();
                isPlaying = false;
                setBgmButtonState("BGM Paused", false);
            } else {
                bgmPlayer.play();
                if (audioCtx && audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
                isPlaying = true;
                setBgmButtonState("BGM Playing", true);
            }
        });

        audioUpload.addEventListener("change", event => {
            const file = event.target.files[0];
            if (!file) {
                return;
            }

            const objectURL = URL.createObjectURL(file);
            bgmPlayer.src = objectURL;
            setupAudioAPI();

            bgmPlayer.play().then(() => {
                isBgmLoaded = true;
                isPlaying = true;
                setBgmButtonState("BGM Playing", true);
            }).catch(error => {
                console.log(error);
                alert("浏览器阻止了自动播放，请再点一次 BGM 按钮开始播放。");
                isBgmLoaded = true;
                isPlaying = false;
                setBgmButtonState("BGM Ready", false);
            });
        });
    </script>
</body>
</html>
